<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>KATA 16:9</title>
    <link rel="stylesheet" href="style.css" />
    <!-- CSS của Choices -->
    <link rel="stylesheet" href="libs/choices.min.css" />
    <!-- JS của Choices -->
    <script src="libs/choices.min.js"></script>
  </head>

  <body>
    <div id="board">
      <input id="titleInput" value="KATA" />

      <div class="info-row">
        <input class="name-box" />
      </div>
      <!-- Dropdown 1 -->
      <div class="dropdown-row ak" id="kataSearchInput">
        <select id="comboDropdown" class="combobox" data-choices>
          <option value="">Chọn bài thi...</option>
        </select>
      </div>

      <!-- Dòng kẻ full khung -->
      <div class="divider"></div>

      <div class="info-row">
        <input class="name-box blue" />
      </div>
      <!-- Dropdown 2 -->
      <div class="dropdown-row ao" id="kataSearchInput2">
        <select id="comboDropdown2" class="combobox" data-choices>
          <option value="">Chọn bài thi...</option>
        </select>
      </div>

      <div class="timer-wrapper" id="timerWrapper">
        <!-- Đồng hồ ở giữa -->
        <div class="center-block">
          <span id="countdown">0:35</span>
          <span id="tickDisplay">00</span>
        </div>
      </div>

      <div class="action-block">
        <!-- Tatami bên trái -->
        <div class="left-block">
          <span class="tatami-text">TATAMI</span>
          <input type="text" id="tatamiInput" value="1" />
        </div>
        <div class="timer-btns">
          <button onclick="startTimer()" id="startBtn">START</button>
          <button onclick="stopTimer()">STOP</button>
          <input type="text" id="timeInput" value="35" maxlength="3" />
          <button onclick="reset()">RESET</button>
          <button id="toggleClockBtn" onclick="toggleClock()">ON</button>
        </div>

        <!-- Logo bên phải -->
        <div class="right-block">
          <img src="images/logo cty mầu.png" alt="Logo" class="logo" />
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
